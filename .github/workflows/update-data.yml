name: Update Pulse data

on:
  schedule:
    - cron: "17 14 * * 1"   # Mondays 14:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch latest Pulse CSV
        run: python3 scripts/update_data.py
      - name: Commit if changed
        run: |
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi
          git config user.name "UncoveredList Team"
          git config user.email "support@uncoveredlist.com"
          git commit -m "Update Pulse data ($(date -u +%Y-%m-%d))"
          git push
